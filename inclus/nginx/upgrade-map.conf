# =============================================================================
#  /etc/nginx/conf.d/upgrade-map.conf
#  Installé par inclus/scripts/70-nginx-tls.sh
#
#  Traduit l'en-tête Upgrade du client en valeur de Connection à transmettre
#  en amont. Sans cette map, /websocket est proxifié en HTTP simple : le jeu
#  se reconnecte en boucle, les mises à jour d'équipement et le comptage du
#  temps de jeu ne remontent jamais.
#
#  Doit être au niveau http{} — d'où conf.d/ plutôt que sites-available/.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
