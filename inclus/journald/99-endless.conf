# =============================================================================
#  /etc/systemd/journald.conf.d/99-endless.conf
#  Installé par inclus/scripts/00-preparer-serveur.sh
#
#  Tous les services (backend, render, boutique) journalisent dans journald.
#  Sans plafond, un RUST_LOG=debug oublié remplit le disque en quelques heures.
#
#  Appliquer :  sudo systemctl restart systemd-journald
#  Vérifier  :  journalctl --disk-usage
# =============================================================================

[Journal]
Storage=persistent
SystemMaxUse=2G
SystemMaxFileSize=128M
MaxRetentionSec=1month
