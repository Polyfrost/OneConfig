[versions]

# Libraries
# All
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.2"
kotlinx-atomicfu = "0.29.0"
fabric-language-kotlin = "1.13.8+kotlin.2.3.0"
google-ksp = "2.3.10"
annotations = "24.1.0"
hypixel-modapi = "1.0.1"
hypixel-data = "0.2.0" # Dep of hypixel-modapi

# Not in risk of needing to be relaunched / bumped by JiJ
snakeyaml = "1.31"
nightconfig = "3.6.6"
isolated-lwjgl3-loader = "0.3.0"
java-objc-bridge = "1.2"

# Per version
lwjgl = "3.3.3" # All downloaded by the isolated-lwjgl3-loader

# Legacy only
mixin-squared = "0.3.7-beta.1"

# Gradle
kotlinx-abi = "0.18.1"

log4j-api = "2.0-beta9" # used because this is the version that 1.8.9 supports, so we have to compile against the same (annoying)

# Compose
compose = "1.12.0-alpha01"
compose-navigation = "2.10.0-alpha01"
skiko = "0.999.3"

lifecycle = "2.11.0-beta01"
viewmodel = "2.11.0-beta01"
commonmark = "0.24.0"

# Testing
junit-bom = "5.10.2"
log4j-impl = "2.23.1" # unvulnerable version

adventure = "4.25.0"
adventure-platform = "4.4.1"
kyori-ansi = "1.1.1"
kyori-examination = "1.3.0"
kyori-option = "1.1.0"
devauth = "1.2.2"

[libraries]
junit = { module = "org.junit.jupiter:junit-jupiter" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }

mixin-squared = { module = "com.github.bawnorton.mixinsquared:mixinsquared-common", version.ref = "mixin-squared" }

isolated-lwjgl3-loader = { module = "org.polyfrost:isolated-lwjgl3-loader", version.ref = "isolated-lwjgl3-loader" }
java-objc-bridge = { module = "ca.weblite:java-objc-bridge", version.ref = "java-objc-bridge" }

hypixel-modapi = { module = "net.hypixel:mod-api", version.ref = "hypixel-modapi" }
hypixel-data = { module = "net.hypixel:hypixel-data", version.ref = "hypixel-data" }

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

logging-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j-api" }
logging-impl = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j-impl" }

lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-nvg = { module = "org.lwjgl:lwjgl-nanovg", version.ref = "lwjgl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-vulkan = { module = "org.lwjgl:lwjgl-vulkan", version.ref = "lwjgl" }

snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
nightconfig = { module = "com.electronwill.night-config:core", version.ref = "nightconfig" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }
nightconfig-yaml = { module = "com.electronwill.night-config:yaml", version.ref = "nightconfig" }
nightconfig-json = { module = "com.electronwill.night-config:json", version.ref = "nightconfig" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu-jvm", version.ref = "kotlinx-atomicfu" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation-desktop", version.ref = "compose" }
jetbrains-compose-material = { module = "org.jetbrains.compose.material:material-desktop", version.ref = "compose" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime-desktop", version.ref = "compose" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "compose" }
jetbrains-compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview-desktop", version.ref = "compose" }
jetbrains-compose-ui-util = { module = "org.jetbrains.compose.ui:ui-util-desktop", version.ref = "compose" }
jetbrains-compose-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
jetbrains-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
jetbrains-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodel" }
jetbrains-skiko-awt = { module = "org.jetbrains.skiko:skiko-awt", version.ref = "skiko" }
jetbrains-skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
jetbrains-skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
jetbrains-skiko-awt-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
jetbrains-skiko-awt-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }

commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }

adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-logger-slf4j = { module = "net.kyori:adventure-text-logger-slf4j", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-serializer-ansi = { module = "net.kyori:adventure-text-serializer-ansi", version.ref = "adventure" }
adventure-text-serializer-commons = { module = "net.kyori:adventure-text-serializer-commons", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-json = { module = "net.kyori:adventure-text-serializer-json", version.ref = "adventure" }
adventure-platform-api = { module = "net.kyori:adventure-platform-api", version.ref = "adventure-platform" }
kyori-ansi = { module = "net.kyori:ansi", version.ref = "kyori-ansi" }
kyori-examination-api = { module = "net.kyori:examination-api", version.ref = "kyori-examination" }
kyori-examination-string = { module = "net.kyori:examination-string", version.ref = "kyori-examination" }
kyori-option = { module = "net.kyori:option", version.ref = "kyori-option" }

devauth-fabric = { module = "me.djtheredstoner:DevAuth-fabric", version.ref = "devauth" }
devauth-neoforge = { module = "me.djtheredstoner:DevAuth-neoforge", version.ref = "devauth" }

[bundles]
adventure = [
    "adventure-key",
    "adventure-api",
    "adventure-text-logger-slf4j",
    "adventure-text-minimessage",
    "adventure-text-serializer-plain",
    "adventure-text-serializer-ansi",
    "adventure-text-serializer-commons",
    "adventure-text-serializer-gson",
    "adventure-text-serializer-json",
    "adventure-platform-api",
    "kyori-ansi",
    "kyori-examination-api",
    "kyori-examination-string",
    "kyori-option",
]
kotlin = ["kotlin-reflect", "kotlin-stdlib", "kotlin-stdlib-jdk7", "kotlin-stdlib-jdk8"]
kotlinx = ["kotlinx-coroutines", "kotlinx-coroutines-jvm", "kotlinx-coroutines-jdk8", "kotlinx-atomicfu"]
lwjgl = ["lwjgl", "lwjgl-nvg", "lwjgl-opengl", "lwjgl-stb", "lwjgl-tinyfd"]
nightconfig = ["nightconfig", "nightconfig-json", "nightconfig-toml", "nightconfig-yaml"]
test-core = ["junit", "logging-impl"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinx-api-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "kotlinx-abi" }

google-ksp = { id = "com.google.devtools.ksp", version.ref = "google-ksp" }
