[versions]
command-api-v2 = "3.1.0+00cb03469e"

# 26.2 uses Minecraft's native Vulkan renderer -> no Cinnabar.
modmenu = "20.0.0-beta.4"
yacl = "3.9.4+26.2-fabric"
moulconfig = "3.11.0"
skyblocker = "C9ZW1qql"
stella = "d12aec9c69"

[libraries]
command-api-v2 = { module = "net.fabricmc.fabric-api:fabric-command-api-v2", version.ref = "command-api-v2" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu"}
yacl = { module = "dev.isxander:yet-another-config-lib", version.ref = "yacl" }
moulconfig = { module = "org.notenoughupdates.moulconfig:common", version.ref = "moulconfig" }
skyblocker = { module = "maven.modrinth:skyblocker-liap", version.ref = "skyblocker" }
#stella = { module = "maven.modrinth:stella", version.ref = "stella"} I prefer modrinth but needed this to work befor I release
stella = { module = "com.github.Eclipse-5214.stella:stella-26.1", version.ref = "stella" }

[bundles]
compat = ["modmenu", "yacl", "skyblocker", "stella"]
