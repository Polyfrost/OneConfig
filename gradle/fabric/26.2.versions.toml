[versions]
api-base = "2.0.4+ece063239c"
lifecycle-events-v1 = "4.1.3+4575b05f9c"
transitive-access-wideners-v1 = "8.1.4+67c847259e"
command-api-v2 = "3.1.0+00cb03469c"
key-mapping-api-v1 = "2.0.5+e2bdee789c"
resource-loader-v1 = "2.0.13+9edec1269c"

# 26.2 uses Minecraft's native Vulkan renderer -> no Cinnabar.
# No 26.2 build of modmenu yet -> modmenu_compat disabled.
yacl = "3.9.4+26.2-fabric"

[libraries]
api-base = { module = "net.fabricmc.fabric-api:fabric-api-base", version.ref = "api-base" }
lifecycle-events-v1 = { module = "net.fabricmc.fabric-api:fabric-lifecycle-events-v1", version.ref = "lifecycle-events-v1" }
transitive-access-wideners-v1 = { module = "net.fabricmc.fabric-api:fabric-transitive-access-wideners-v1", version.ref = "transitive-access-wideners-v1" }
command-api-v2 = { module = "net.fabricmc.fabric-api:fabric-command-api-v2", version.ref = "command-api-v2" }
key-mapping-api-v1 = { module = "net.fabricmc.fabric-api:fabric-key-mapping-api-v1", version.ref = "key-mapping-api-v1" }
resource-loader-v1 = { module = "net.fabricmc.fabric-api:fabric-resource-loader-v1", version.ref = "resource-loader-v1" }

yacl = { module = "dev.isxander:yet-another-config-lib", version.ref = "yacl" }

[bundles]
compat = ["yacl"]
fabric-api = ["api-base", "lifecycle-events-v1", "transitive-access-wideners-v1", "command-api-v2", "key-mapping-api-v1", "resource-loader-v1"]
