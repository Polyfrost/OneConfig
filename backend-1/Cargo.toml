[workspace]
members = [ ".", "maven" ]

[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["Ty <ty@myriation.xyz>"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

[package]
name = "backend"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
actix-web = { version = "4.12.1", features = ["http2"] }
base16ct = { version = "0.3.0", features = ["alloc"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
documented = "0.9.2"
env_logger = "0.11.8"
maven = { version = "*", path = "maven" }
moka = { version = "0.12.12", features = ["future"] }
prometheus-client = "0.24.0"
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "json", "rustls-no-provider"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12", "logging"] }
semver = "1.0.26"
serde = { workspace = true }
serde_json = { workspace = true }
serde_variant = "0.1.3"
sha2 = "0.11.0-rc.3"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.4", features = ["serde"] }
